name: Windows CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang poppler-utils
          python -m pip install pynacl==1.6.2
      - name: Fetch and verify Monocypher 4.0.3
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            https://monocypher.org/download/monocypher-4.0.3.tar.gz -o monocypher-4.0.3.tar.gz
          echo '8cc9bc341a66249016db9bd70e9142d8d0aef9945973744b1ac05dbc55d8ee66  monocypher-4.0.3.tar.gz' | sha256sum -c -
          tar -xzf monocypher-4.0.3.tar.gz
      - name: Test CLI and Monocypher core interoperability
        run: make test-monocypher CC=clang PYTHON=python MONOCYPHER_DIR="$RUNNER_TEMP/monocypher-4.0.3/src"
      - name: Run core, adapters, and CLI tests
        run: make test CC=clang PYTHON=python
      - name: Run ASan and UBSan tests
        run: make test-asan CC=clang PYTHON=python
      - name: Run isolated repository sentinel tests
        run: make test-sentinels CC=clang PYTHON=python
      - name: Fetch and test pinned SOES baseline
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/soes-baseline"
          for file in esc.c esc.h esc_foe.c esc_foe.h; do
            curl --fail --silent --show-error --location --retry 3 \
              "https://raw.githubusercontent.com/OpenEtherCATsociety/SOES/6ef7b9415e936c061ad30626ca00004bdde2ac62/soes/$file" \
              -o "$RUNNER_TEMP/soes-baseline/$file"
          done
          make test-soes CC=clang PYTHON=python SOES_DIR="$RUNNER_TEMP/soes-baseline" SOES_HASH_STRICT=1
      # SSC and physical hardware integration are not covered by this job.
  build:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Require prerelease tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+-(alpha|beta|rc)\.[0-9]+$') {
            throw 'Use a prerelease tag such as v0.1.0-alpha.1'
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CLI build and signing dependencies
        run: python -m pip install pynacl==1.6.2 pyinstaller==6.16.0
      - name: Test Python tool
        run: python tests/test_efw_pack.py
      - name: Generate CLI build metadata
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME
          } else {
            $shortSha = $env:GITHUB_SHA.Substring(0, 7)
            $version = "development+$shortSha"
          }
          $buildDate = [DateTime]::UtcNow.ToString('yyyy-MM-dd') + ' UTC'
          $metadataPath = Join-Path $env:RUNNER_TEMP 'ecat_build_info.py'
          $metadata = "VERSION = '$version'`nBUILD_DATE = '$buildDate'`n"
          [IO.File]::WriteAllText($metadataPath, $metadata, [Text.UTF8Encoding]::new($false))
      - name: Build Windows console executable
        run: python -m PyInstaller --onefile --console --clean --collect-all nacl --hidden-import nacl.bindings --hidden-import _cffi_backend --paths "$env:RUNNER_TEMP" --name ecat-efw tools/efw_pack.py
      - name: Test packaged executable
        run: python tests/test_release_cli.py dist/ecat-efw.exe
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ecat-efw.exe, LICENSE -DestinationPath dist/ecat-efw-windows-x64.zip
          $hash = (Get-FileHash dist/ecat-efw-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$pwd/dist/ecat-efw-windows-x64.zip.sha256", "$hash  ecat-efw-windows-x64.zip`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v4
        with:
          name: ecat-efw-windows-x64
          path: |
            dist/ecat-efw-windows-x64.zip
            dist/ecat-efw-windows-x64.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: [build, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ecat-efw-windows-x64
          path: release
      - name: Prepare release notes
        shell: bash
        run: |
          previous=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          {
            echo '## 本次更新'
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              git log --no-merges -10 --format='- %s' HEAD
            fi
            echo
            echo '## 使用与验证'
            echo
            echo '- 下载 Windows x64 ZIP，解压后在 PowerShell 运行 `./ecat-efw.exe --help`。'
            echo '- 附带 SHA-256 校验文件；Windows CLI 构建及自动测试通过。'
            echo '- 这是测试版，程序未签名；真实 MCU 板卡与主站升级尚未验证。'
          } > release-notes.md
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "$TAG" --notes-file release-notes.md --prerelease
