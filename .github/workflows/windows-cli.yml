name: Windows CLI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Python tool
        run: python tests/test_efw_pack.py
      - name: Install build dependency
        run: python -m pip install pyinstaller==6.16.0
      - name: Build Windows console executable
        run: python -m PyInstaller --onefile --console --clean --name ecat-efw tools/efw_pack.py
      - name: Test packaged executable
        run: python tests/test_release_cli.py dist/ecat-efw.exe
      - name: Package and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ecat-efw.exe, LICENSE -DestinationPath dist/ecat-efw-windows-x64.zip
          $hash = (Get-FileHash dist/ecat-efw-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$pwd/dist/ecat-efw-windows-x64.zip.sha256", "$hash  ecat-efw-windows-x64.zip`n", [Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v4
        with:
          name: ecat-efw-windows-x64
          path: |
            dist/ecat-efw-windows-x64.zip
            dist/ecat-efw-windows-x64.zip.sha256
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ecat-efw-windows-x64
          path: release
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "$TAG" --generate-notes
